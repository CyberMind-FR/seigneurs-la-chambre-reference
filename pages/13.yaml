canonical_text: 'Un patrimoine à préserver


  De 1030 à 1454, pendant plus de 400 ans, les seigneurs de La Chambre ont façonné l''histoire de la Maurienne. Rivaux puis
  alliés des Comtes de Savoie, croisés à Jérusalem, conseillers des princes, fondateurs de couvents, ils ont été les véritables
  maîtres de notre vallée.

  Leur nom résonne encore dans chaque pierre de nos châteaux, dans chaque voûte du cloître des Cordeliers, dans chaque page
  des archives médiévales. Ils nous rappellent qu''avant d''être savoyarde, puis française, la Maurienne fut d''abord chambrienne.


  CARTE DES 10 SITES PATRIMONIAUX

  • La Chambre : Couvent, Maison de La Tour

  • Notre-Dame-du-Cruet : Château, Tour

  • Sainte-Marie-de-Cuines : Château Joli, Tour de Burgin

  • Saint-Étienne-de-Cuines : Châtel-André, Châtelet, Gruyère

  • Saint-Rémy-de-Maurienne : La Landonnière


  Ce patrimoine est fragile. Certains sites ont déjà disparu, d''autres nécessitent une attention urgente. L''Association
  « Les Amis du Couvent des Cordeliers de La Chambre » œuvre pour préserver et valoriser ces témoignages irremplaçables de
  notre histoire commune.


