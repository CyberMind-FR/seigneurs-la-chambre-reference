canonical_text: 'La Tour de Châtel-André

  Sentinelle des vassaux (XIIe siècle)


  Sentinelle sur la vallée

  Levez les yeux vers le hameau du Perrel ! À 100 mètres au-dessus de la vallée, surgissent les ruines d''un imposant donjon
  : 7 mètres sur 8, bâti en pierres massives, partie romane encore visible. Cette tour, c''est Châtel-André. De là-haut, vue
  imprenable sur tout le bassin de La Chambre et la route du Mont-Cenis.


  Tour des vassaux, pas des seigneurs !

  Contrairement aux châteaux du Cruet et Château-Joli qui appartenaient directement aux seigneurs de La Chambre, Châtel-André
  était la possession de leurs vassaux : la famille de Cuines ! Un vassal est un seigneur de rang inférieur qui tenait en
  fief ses terres d''un suzerain plus puissant. Les Cuines devaient aux La Chambre : hommage, conseil, aide militaire et aide
  financière.

  On connaît les noms de ces vassaux : Antoine, seigneur de Cuines (1355) et Jacques (1392). Leur tour contrôlait la route
  du Mont-Cenis, le passage du Glandon et les terres agricoles de la plaine.


  1598 : Prise et reprise spectaculaire

  Créqui, capitaine du maréchal de Lesdiguières (camp français), s''empare de Châtel-André au cours de la guerre pour le marquisat
  de Saluces ! Mais victoire de courte durée : le duc Charles-Emmanuel Ier de Savoie contre-attaque et bat les troupes françaises
  à Épierre et dans la plaine des Cuines. Créqui est repoussé, Châtel-André reprise !


