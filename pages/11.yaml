canonical_text: 'La Tour de Notre-Dame-du-Cruet

  Sentinelle oubliée de la vallée du Bugeon


  Au centre du village de Notre-Dame-du-Cruet se dresse une tour carrée médiévale, sentinelle de la vallée du Bugeon. Cette
  tour de quatre étages, haute de 12 mètres environ, témoigne du réseau de surveillance mis en place par les seigneurs de
  La Chambre.

  L''accès se faisait par une échelle amovible au premier étage, dispositif de défense classique au Moyen Âge. En cas d''attaque,
  l''échelle retirée, la tour devenait imprenable.


  CARTE

  LOCALISATION

  Lat: 45.3699° N

  Lng: 6.3109° E

  GOOGLE MAPS

  Scannez pour y aller

  MAPPE SARDE (1728-1738) — Paroisse de Notre-Dame-du-Cruet — ADS, série C • patrimoines.savoie.fr


  CARACTÉRISTIQUES

  • Plan carré, murs de plus de 40 cm d''épaisseur

  • Hauteur : environ 12 mètres (4 étages)

  • Propriété privée'
