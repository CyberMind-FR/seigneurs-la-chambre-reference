canonical_text: 'La Maison Forte de Gruyère

  Saint-Étienne-de-Cuines, La Borgeat


  Tour ronde imposante jouxte un corps de logis flanqué d''une tour carrée. Cette maison forte remarquable témoigne de l''architecture
  défensive médiévale en Maurienne.

  En 1477, Pierre de Gruyère — des célèbres comtes suisses du même nom — en hérite, donnant son nom à l''édifice. Un magnolia
  séculaire ombrage encore aujourd''hui cette demeure chargée d''histoire.


  CARTE

  LOCALISATION

  Lat: 45.3490° N

  Lng: 6.3210° E

  GOOGLE MAPS

  Scannez pour y aller

  MAPPE SARDE (1728-1738) — Paroisse de Saint-Étienne-de-Cuines — ADS, série C • patrimoines.savoie.fr


  ARCHITECTURE

  • Tour ronde + Tour carrée

  • Magnolia séculaire

  • Propriété privée'
