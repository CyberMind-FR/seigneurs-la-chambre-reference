canonical_text: 'La Tour de Burgin

  Une demeure nobiliaire effacée de la mémoire


  Une tour engloutie par le temps

  En contrebas du majestueux manoir de Châtel-André, là où les regards se portent aujourd''hui sur des maisons modernes et
  des champs paisibles, se dressait autrefois une tour médiévale dont le nom même est tombé dans l''oubli : la Tour de Burgin.

  Construite à la même époque que le Châtelet de Châtel-André (XVe-XVIe siècles), cette demeure fortifiée faisait partie du
  réseau défensif qui gardait l''accès à la vallée. Aujourd''hui, ses ruines sont « réduites à fort peu de choses », comme
  l''écrivait l''historien Georges Chapier en 1957. Pendant des générations, ses pierres ont été récupérées pour bâtir les
  maisons des alentours.


  Les nobles Du Pont : une famille oubliée

  Sur les origines de la Tour de Burgin, « on ignore à peu près tout », reconnaissait Georges Chapier. Les archives nous apprennent
  seulement qu''elle appartenait aux XVe et XVIe siècles aux nobles du Pont. Cette famille s''éteignit avec Urbain du Pont,
  dernier héritier mâle. La Tour de Burgin revint à l''une de ses filles, Marie du Pont, qui épousa Christophe de Bellegarde.


  Jean Truchet : l''oncle du chimiste Berthollet

  Au début du XVIIIe siècle, la Tour de Burgin est acquise par Jean Truchet, un avocat prospère de la vallée. Jean Truchet
  devint l''oncle par alliance de Claude-Louis Berthollet (1748-1822), chimiste de génie né à Talloires, ami intime de Napoléon
  Bonaparte, membre de l''expédition d''Égypte, et créateur de la nomenclature chimique encore utilisée aujourd''hui.


  CARTE

  LOCALISATION

  Lat: 45.3555° N

  Lng: 6.3050° E

