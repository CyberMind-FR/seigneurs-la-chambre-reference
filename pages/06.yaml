  Scannez pour y aller

  MAPPE SARDE (1728-1738) — Paroisse de Sainte-Marie-de-Cuines — ADS, série C • patrimoines.savoie.fr


  « La Tour de Burgin nous rappelle que le patrimoine n''est pas éternel. Sans protection, sans entretien, sans mémoire collective,
  les plus fières forteresses redeviennent poussière. »'
