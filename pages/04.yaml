canonical_text: 'La Maison de La Tour

  Du siège de la châtellenie comtale au pouvoir administratif


  Au cœur du bourg : le pouvoir administratif

  Oubliez les châteaux perchés sur leurs promontoires rocheux. La Maison de La Tour se dresse au centre même du village de
  La Chambre, accessible, visible, imposante. Ce n''est pas une forteresse militaire : c''est le siège du pouvoir administratif,
  le cœur battant de la châtellenie de Maurienne.

  Construite au XIIIe siècle, cette tour carrée de trois étages avec ses murs de forte proportion affirme une présence. Mais
  à qui appartient-elle ? Surprise : pas aux seigneurs de La Chambre ! Cette « fortalisse » est propriété du comte de Savoie
  lui-même.


  1285 : L''achat décisif

  Le 14 novembre 1285, un acte notarié scelle le destin de la Tour. Guilemet vend au comte Amé de Savoie des « maisons fortes
  » situées au bourg de La Chambre : deux tours, des maisons attenantes, pour la somme considérable de 340 florins.

  À partir de cette date, la Tour devient officiellement le centre administratif du comte de Savoie en Maurienne. Le châtelain
  y siège, y rend la justice, y perçoit les taxes, y conserve les archives.


  1456 : Du comte aux seigneurs

  Coup de théâtre le 22 décembre 1456 ! Le duc de Savoie Louis vend la maison forte de la Tour à Aymon de La Chambre. C''est
  un tournant majeur. Après près de deux siècles de propriété comtale, la Tour passe aux mains de la famille seigneuriale.
  Les La Chambre réunissent enfin sous leur autorité le pouvoir féodal et le pouvoir administratif.


  Aujourd''hui, la Maison de La Tour demeure un remarquable témoin de l''histoire administrative de la Maurienne.


