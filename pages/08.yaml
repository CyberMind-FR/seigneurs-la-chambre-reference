canonical_text: 'La Maison-Forte du Châtelet

  Des seigneurs de Cuynes aux notaires modernes


  La tour des vassaux

  Au centre du village de Saint-Étienne-de-Cuines, dominant la route qui mène au col du Glandon, se dresse la Maison-Forte
  du Châtelet. Grosse maison carrée avec son toit à quatre pans, ses belles terrasses formant jardins suspendus, et son magnolia
  centenaire : c''est l''une des maisons fortes les plus remarquables de Maurienne.

  Construite au XIIIe siècle, la tour du Châtelet s''inscrit dans le vaste système défensif des seigneurs de La Chambre. Cette
  tour de défense surveille la vallée des Villards d''où peuvent surgir les ennemis dauphinois.


  XVe siècle : La famille De Pont puis de Gruyère

  Au XVe siècle, la tour appartient à la famille De Pont. En 1477, un événement inattendu bouleverse l''histoire : Pierre
  de Gruyère, fils bâtard du comte de Gruyère, hérite de la maison forte. Voilà comment une demeure mauriennaise devient la
  propriété d''une famille venue de Suisse !


  1629 : L''ère des notaires

  En 1629, Colomban Rostaing, notaire à Saint-Colomban-des-Villards, achète le Châtelet. C''est un tournant symbolique : la
  maison forte passe des mains de la noblesse féodale à celles de la bourgeoisie de robe. Et remarquablement, le Châtelet
  est resté propriété de notaires jusqu''à aujourd''hui !


  CARTE

  LOCALISATION

  Lat: 45.3505° N

  Lng: 6.3195° E

  GOOGLE MAPS

  Scannez pour y aller

  MAPPE SARDE (1728-1738) — Paroisse de Saint-Étienne-de-Cuines — ADS, série C • patrimoines.savoie.fr


  AUJOURD''HUI

  • Gîtes de caractère « Le Colombier » et « Le Glandon »

  • Le plus vieux magnolia de la commune ombrage la tour

  • Située au centre du village, sur la route du col du Glandon'
