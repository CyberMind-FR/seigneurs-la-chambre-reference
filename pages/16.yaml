page: 16
title: Remerciements
role: page_finale
canonical_text: 'Merci


  Nous remercions toutes celles et ceux qui, par leurs recherches,

  leurs témoignages, leur soutien ou leur curiosité, contribuent à faire vivre

  la mémoire des seigneurs de La Chambre et de leur patrimoine.


  Ce parcours patrimonial est une invitation à continuer d’explorer,

  de transmettre et de préserver ce riche héritage, au cœur de la Maurienne.


  À toutes et à tous,

  merci !


  Amis du Couvent des Cordeliers de La Chambre

  www.couventdelachambre.fr


  Découvrir • Partager • Préserver

  '
