canonical_text: 'La Maison Forte de La Landonnière

  Sentinelle des Seigneurs à Saint-Rémy (XVe siècle)


  L''extension du pouvoir seigneurial vers Saint-Rémy

  À quatre kilomètres en aval de La Chambre, sur le territoire de Saint-Rémy-de-Maurienne, une maison forte aujourd''hui méconnue
  témoigne de l''étendue du réseau défensif des seigneurs de La Chambre. La Landonnière, édifiée au XVe siècle, incarne cette
  stratégie de contrôle territorial.

  Lorsque vous longez la route menant de La Chambre vers Saint-Jean-de-Maurienne, imaginez ce réseau de demeures fortifiées
  : le château de Notre-Dame-du-Cruet dominant la vallée, la Tour de La Chambre contrôlant le bourg, le Château-Joli surveillant
  Sainte-Marie-de-Cuines... et plus bas, discrète mais stratégique, la maison forte de La Landonnière prolongeant l''influence
  seigneuriale jusqu''à Saint-Rémy.


  Aymon de La Chambre, bâtisseur et héritier (1454-1466)

  Les archives identifient Aymon de La Chambre comme le premier propriétaire de cette maison forte. Aymon de Seyssel, devenu
  Aymon de La Chambre en 1454 lorsqu''il hérita de son oncle Gaspard, dernier représentant de la lignée directe des vicomtes
  de Maurienne. Parmi ses nombreux titres figurait celui de baron de Saint-Rémy.


  La Chapelle Saint-Claude (1571)

  Plus d''un siècle après la construction de la maison forte, en 1571, une chapelle dédiée à Saint Claude fut édifiée à La
  Landonnière. Ce saint évêque de Besançon, très vénéré dans les Alpes, comptait une dizaine de chapelles dans chaque diocèse
  savoyard. L''ajout d''une chapelle privée témoigne du statut élevé des propriétaires.


