canonical_text: 'L''Association

  Les Amis du Couvent des Cordeliers de La Chambre

  Créée en 2020, notre association a pour mission de faire connaître, préserver et valoriser le patrimoine du couvent des
  Cordeliers de La Chambre et plus largement le patrimoine historique de la Maurienne.

  NOUS REJOINDRE

  • Adhésion annuelle : 5 €

  • Dons déductibles (66%)

  • Collecte Fondation du Patrimoine (66%)

  • Site : www.couventdelachambre.fr

  • Email : contact@couventdelachambre.fr

  • Mairie de La Chambre : 04 79 56 30 32

  « Préserver ce patrimoine exceptionnel pour les générations futures »

  AUTEUR DE RÉFÉRENCE

  Philippe DEMARIO

  • Les Seigneurs de La Chambre en Maurienne, des origines…

  Éditions Derrier, 1999, 328 p.

  • La Chambre — Un village en Maurienne, des origines à la Seconde Guerre Mondiale

  Éditions De Mario, 2000 (ISBN 978-2-9515915-0-9)

  • La Maurienne médiévale — Châteaux et maisons fortes

  avec Jean Prieur, Éditions Alan Sutton, 2005 (ISBN 978-2-84253-805-7)

  Ouvrages en dépôt-vente à l’Office de Tourisme de La Chambre

  Sources principales :

  Laurence DALMASSO, Le couvent des Frères Mineurs Conventuels de La Chambre, 2001

  Georges CHAPIER, Châteaux Savoyards - Tome III : Les Châteaux de Maurienne, 1957

  Commission Histoire et Patrimoine

  Fabrice GALOPO, André GRANGE, Gérald KERMA

  Décembre 2025'
