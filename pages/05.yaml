canonical_text: 'Le Château Joli

  La poype féodale des premiers seigneurs (XIe-XIVe siècle)


  Face à face : deux châteaux, une dynastie

  Depuis la plaine des Cuines, levez les yeux. Au-dessus du village de Sainte-Marie, sur un mamelon stratégique, les ruines
  du Château Joli surveillent encore la vallée. En face, de l''autre côté de l''Arc, se dressait le Château du Cruet. Deux
  forteresses, deux promontoires rocheux, une seule famille : les seigneurs de La Chambre.

  Cette disposition n''est pas un hasard. Les deux châteaux communiquaient visuellement, se répondaient, se complétaient.
  L''un surveillait la vallée des Villards au sud, l''autre contrôlait la route du Mont-Cenis. Ensemble, ils formaient un
  système défensif implacable.


  Une « poype » : forteresse naturelle

  Le Château Joli s''élève sur une poype féodale - un promontoire naturel transformé en forteresse imprenable. Sous le château
  actuel, les archéologues ont découvert les traces d''une motte encore plus ancienne, antérieure au XIe siècle. Ce site était
  donc déjà un lieu de pouvoir avant même l''arrivée des La Chambre.


  Une princesse au château

  Le Château Joli abrite la lignée directe de Richard Ier de La Chambre. Vers 1350, le château accueille une résidente illustre
  : Agnès de Savoie-Achaïe, épouse de Jean II de La Chambre. Une princesse de sang comtal qui a grandi à la cour de Savoie
  vient s''installer dans cette forteresse mauriennaise.


  CARTE

  LOCALISATION

