  - {id: title_ornament, role: ornament, status: APPROVED, bbox_px: {x: 222, y: 83, w: 333, h: 32}, treatment: crop_only}
  - {id: logo_raster, role: canonical_raster_text_absent_from_yaml, status: APPROVED, bbox_px: {x: 227, y: 393, w: 316, h: 222}, treatment: crop_only, note: "logo de l'association tel que présent dans la page canonique (texte intrinsèque « Amis du Couvent des Cordeliers De La Chambre. ») ; l'actif vectoriel officiel reste BLOCKED_SOURCE_ASSET"}
