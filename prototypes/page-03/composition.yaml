qr:
  - {id: google_maps, svg: assets/qr-svg/page-03-google-maps.svg, placement: reference_canvas}

validation:
  canonical_text_exact: true
  all_blocks_assigned: true
  qr_exact_decode: true
  fragment_sha256: true
  min_effective_ppi: {continuous_tone: 300, line_art: 1200}  # at final placement size, every format
  accept_fragment_statuses: [APPROVED]
  edge_ink_epsilon: 0.02
  fragment_edge_ink: warn
  text_ink_collision: fail
  text_ink_collision_min_px: 40
  text_overflow: warn
  fragment_lock: warn
  # Dérogation explicite de résolution (décision du propriétaire du projet, 2026-09-09) :
  # les rasters canoniques (181–186 ppi à la taille A5) sont acceptés pour la sortie A5 ;
  # les gates 300/1200 restent la cible et restent bloquants pour A2/A1.
  resolution_waiver: {approved: true, approved_by: gkerma, date: '2026-09-09', page_sizes: [A5], min_ppi_accepted: 180}
  # Upscale provisoire (décision gkerma, 2026-09-09 : « prendre en compte le dpi demandé… upscale des croquis
  # si nécessaire ! On le régénérera ultérieurement ») : chaque fragment est rééchantillonné (Lanczos) jusqu'au
  # gate de son type à la taille A5 ; journalisé par fragment (upscale_factor), jamais présenté comme source HD.
  upscale: {enabled: true, approved_by: gkerma, date: '2026-09-09', max_factor: 8, note: "provisoire — croquis à régénérer en haute définition"}
