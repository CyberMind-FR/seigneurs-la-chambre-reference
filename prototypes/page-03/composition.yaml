  - {id: nave_captioned,              role: documentary_illustration_with_canonical_raster_caption, status: APPROVED, bbox_px: {x: 787, y: 536,  w: 204, h: 286}, treatment: crop_only, mask_px: [{box: [854, 760, 130, 62], fill: paper}]}
  - {id: portal_detail,               role: documentary_detail,                                     status: APPROVED, bbox_px: {x: 638, y: 836,  w: 114, h: 194}, treatment: crop_only}
  - {id: lintel_accolade_captioned,   role: documentary_detail_with_canonical_raster_caption,       status: APPROVED, bbox_px: {x: 787, y: 821,  w: 205, h: 221}, treatment: crop_only, mask_px: [{box: [789, 991, 170, 40], fill: paper}]}
