  - {id: franciscan_caption_raster,   role: canonical_raster_caption_absent_from_yaml,              status: APPROVED, bbox_px: {x: 779, y: 160,  w: 92,  h: 54},  treatment: crop_only, note: "caption « Spiritualité franciscaine » + arrow; absent from pages/03.yaml, kept raster, not OCRed"}
