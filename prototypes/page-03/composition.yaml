# Layered v3 composition — page 03 — Le Couvent des Cordeliers
# Port of the validated prototype (scripts/prototype_page03_*.py, run 34259978419) to the
# generic YAML-driven composer (scripts/layered_compose.py). Geometry is expressed in
# canonical-raster pixels (1024x1536); text comes only from pages/03.yaml:canonical_text.
schema_version: 1
page: 3
title: Le Couvent des Cordeliers
status: APPROVED  # port validé par gkerma le 2026-09-09
source:
  path: assets/page-03.jpg
  sha256: aa327f243594a23d91a2e6c4e61a0ed0a3f0aa4c0d143444aa56cb3bb4e67955
canonical_text:
  path: pages/03.yaml
  key: canonical_text
  expected_blocks: 32
qr_registry: qr_registry.yaml
canvas:
  page_size: A5
  fit: contain
  background: "#fffdf7"
  qr_reference_canvas: [1920, 2880]
layer_order: [background, raster_fragments, documentary_vectors, text_layer, functional_overlay]
text_styles_from: prototypes/_shared/text-styles.yaml
text_styles:
  small_bold_center: {font: LiberationSerif-Bold, size: 6.1, leading: 6.8, color: "#2f241e", align: center}

# Fragments reviewed in prototypes/page-03/fragment-boxes.yaml (run 34251564059), re-cut after
# the review of the first generic proof (2026-09-09):
#  * franciscan_monk_captioned contained raster residue of the canonical title/subtitle
#    ("rs", "bre") and its left edge clipped the caption "franciscaine": split into the figure
#    (ink starts x=840, title residue ends x=835) and a separately measured caption fragment;
#  * portal_gothique: the top edge cut the arch (ink from y=10) and the right edge touched the "L"
#    of the raster title (x>=207);
#  * site_visit_illustration: the canonical heading "VISITE DU SITE" sits on the sky of the
#    drawing; the crop now keeps the mountain tops (ink from y=1355) and masks the old raster
#    heading locally, the live heading is composed at the canonical position.
# Edge-ink warnings that remain concern the page frame lines adjoining the crops.
fragments:
  - {id: portal_gothique_captioned,   role: documentary_illustration_with_canonical_raster_caption, status: APPROVED, bbox_px: {x: 27,  y: 10,   w: 180, h: 246}, treatment: crop_only, mask_px: [{box: [56, 195, 98, 56], fill: paper}]}
  - {id: cloister_baroque_captioned,  role: documentary_illustration_with_canonical_raster_caption, status: APPROVED, bbox_px: {x: 30,  y: 260,  w: 180, h: 262}, treatment: crop_only, mask_px: [{box: [55, 479, 96, 40], fill: paper}]}
