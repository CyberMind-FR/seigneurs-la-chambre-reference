schema_version: 2
project: Les Seigneurs de La Chambre
prototype: v3-layered-page-03
page: 3
title: Le Couvent des Cordeliers
status: PORTED_TO_GENERIC_COMPOSER  # see composition.yaml (2026-09-09)
purpose: validate layered composition before industrializing 16 pages

sources:
  canonical_page:
    path: assets/page-03.jpg
    sha256: aa327f243594a23d91a2e6c4e61a0ed0a3f0aa4c0d143444aa56cb3bb4e67955
  canonical_text:
    path: pages/03.yaml
    key: canonical_text
  qr_registry: qr_registry.yaml
  qr_svg: assets/qr-svg/page-03-google-maps.svg
  asset_spec: assets/ASSET_SPEC.md
  object_inventory: prototypes/page-03/page-03.objects.yaml

inventory_model:
  hierarchy: page -> regions -> objects -> subobjects -> layers
  phase_a_zones_are: macro_layout_reference
  phase_a_zones_are_not: exhaustive_extractable_object_inventory
  extraction_gate: prototypes/page-03/page-03.objects.yaml:completeness_gate
  extraction_allowed: true  # fragments locked in fragments.lock.yaml

composition_order:
  - background
  - raster_fragments
  - documentary_vectors
  - text_layer
  - functional_overlay

layers:
  background:
    kind: generated_deterministic_background
    content: none
    style_source: style.yaml
    requirements:
      - white_or_light_ivory_printable
      - subtle_grain_only
      - no_documentary_information
      - reusable

  raster_fragments:
    kind: extracted_from_canonical_page
    source: assets/page-03.jpg
    inventory_source: prototypes/page-03/page-03.objects.yaml
    extraction_policy: preserve_validated_visuals_without_reconstruction
    status: BLOCKED_UNTIL_OBJECT_INVENTORY_PASS
    rule: never derive fragment list directly from Phase A zone count
    required_metadata:
      - object_id
      - source_page
      - source_bbox_px
      - output_dimensions_px
      - treatment
      - sha256
      - rights_status

  documentary_vectors:
    kind: reusable_non_text_vectors
    allowed:
      - assets/svg/spiritualcept-ornaments.svg
    rule: vectors_optional_not_goal

  text_layer:
    kind: real_text
    source: pages/03.yaml:canonical_text
    authority: canonical_yaml_only
    selectable_in_pdf: true
    ocr_as_authority: false
    rasterized_text_forbidden_when_avoidable: true

  functional_overlay:
    kind: deterministic
    qr:
      id: P03-O-QR01
      source: assets/qr-svg/page-03-google-maps.svg
      payload_authority: qr_registry.yaml
      canonical_reference_placement_px:
        x: 1435
        y: 2081
        w: 234
        h: 234
      placement_policy: translate_reference_geometry_into_composition_coordinates
      render_last: true
      final_machine_decode_required: true

validation:
  object_inventory_complete: required_before_extraction
  canonical_text_exact: required
  fragment_provenance: required
  no_residual_editorial_text_in_visual_fragments: required
  raster_effective_resolution: required
  qr_exact_decode: required
  visual_comparison_to_canonical: required
  pdf_text_layer: required

prototype_decisions:
  page_03_selected_because:
    - representative_site_page
    - contains_long_text
    - contains_documentary_visuals
    - contains_map_and_location_block
    - contains_functional_qr
    - not_page_04_editorial_block
  no_page_raster_modification: true
  no_free_reconstruction: true
  no_new_historical_assertion: true
  previous_fragment_assumptions_invalidated: true

next_step:
  - inspect_full_canonical_raster_at_native_resolution
  - populate_page_03_objects_yaml_exhaustively
  - perform_second_visual_completeness_sweep
  - set_completeness_gate_PASS_only_after_no_unregistered_visible_object_remains
  - measure_and_extract_registered_fragments
  - register_fragment_sha256_and_provenance
  - implement_composer
  - build_control_pdf_with_real_text_layer
  - validate_qr_and_visual_fidelity
