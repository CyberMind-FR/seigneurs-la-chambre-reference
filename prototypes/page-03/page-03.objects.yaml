schema_version: 1
page: 3
source_image:
  path: assets/page-03.jpg
  supplied_visual_measurement_size_px: [1024, 1536]
  coordinate_origin: top_left
  bbox_format: [x, y, width, height]
status: MEASURED_OBJECT_MAP_V1
method: manual_visual_measurement_on_supplied_full_page_image
note: >-
  This object map supersedes use of the nine Phase-A macro zones as an extraction list.
  Macro zones remain layout semantics only. Objects below are production-level visual objects.
  Bounding boxes are measured on the 1024x1536 supplied page image and must be scaled
  proportionally if the repository canonical JPEG has different pixel dimensions.

object_classes:
  graphic: extractable documentary or illustrative raster object
  ornament: non-editorial decorative object
  functional: machine-functional object to replace from deterministic source
  frame: structural geometry, preferably reconstructed as vector/layout rather than cropped
  text: editorial content, never extracted as raster for v3

