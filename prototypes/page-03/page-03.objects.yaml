notes:
  - This replaces the assumption that the 9 Phase-A macro zones are an exhaustive object inventory.
  - Bounding boxes are measured from the supplied 1024x1536 reference and carry a +/-6 px review tolerance.
  - Text zones are explicitly included. Their pixels are not to be reused as editorial content; the YAML canon is authoritative.
  - Map labels are intrinsic to the map document and may remain raster inside G09 unless a separately sourced map reconstruction is authorized.
  - Some graphic objects have soft watercolor edges; final extraction should use masks with feathering rather than rectangular crops in composition.
  - Before industrialization, create a visual overlay and perform a second human pass for missed micro-ornaments and overlaps.