text_regions:
  policy: canonical_yaml_real_text_only
  source: pages/03.yaml:canonical_text
  raster_extraction_forbidden: true
  regions:
    - title_and_subtitle
    - caption_portail_gothique
    - caption_cloitre_baroque
    - caption_voutes
    - callout_spiritualite_franciscaine
    - section_vision_heading_and_body
    - caption_panorama_cruet
    - section_necropole_heading_and_body
    - caption_nef
    - section_patrimoine_heading_and_body
    - caption_linteau
    - carte_heading
    - localisation_heading_coordinates
    - google_maps_heading_and_scan_instruction
    - mappe_sarde_source_caption
    - visite_site_heading_and_information

review_gates:
  - verify_each_bbox_against_repository_canonical_pixel_dimensions
  - inspect_edges_at_100_percent_before_crop
  - expand_crop_only_when_needed_to_preserve_strokes
  - remove_no_documentary_detail
  - never_use_phone_ocr_as_text_authority
  - preserve_intrinsic_text_inside_documentary_map_only
  - use_deterministic_qr_svg_not_visible_qr_pixels
  - compare_recomposition_to_full_canonical_page
