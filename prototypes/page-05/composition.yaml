# Text visible in the canonical raster but absent from pages/05.yaml:canonical_text.
# Kept raster inside the fragment named; never retyped; reported for editorial arbitration.
discrepancies:
  arbitration: {status: VALIDATED, by: gkerma, date: '2026-09-09', decision: "le canon (pages/NN.yaml) prévaut ; les textes raster absents du canon restent dans leurs fragments, non retypés"}
  raster_text_absent_from_canon:
    - {fragment: running_head_raster, description: "bandeau courant « Les Seigneurs de La Chambre et leur patrimoine en Maurienne »"}
    - {fragment: heraldry_captioned, description: "légende des armoiries (voir blasonnement officiel p.2)"}
    - {fragment: hero_captioned, description: "callouts de la vue principale (Face à face… / Le Château Joli domine…)"}
    - {fragment: poype_captioned, description: "annotations du croquis de la poype et cartouche POYPE FÉODALE"}
    - {fragment: princess_captioned, description: "légende du portrait d'Agnès de Savoie-Achaïe (dates)"}
