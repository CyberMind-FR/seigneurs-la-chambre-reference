# Registre des armoiries communales des sites de l'exposition (demande du propriétaire, 2026-09-10).
#
# Règle : aucune armoirie n'est composée tant que l'entrée n'est pas VERIFIED — fichier présent,
# SHA-256, licence, auteur, URL source, blasonnement et sa source, vérificateur et date. Le
# compositeur (`communal_arms` dans prototypes/page-NN/composition.yaml) remplace alors le fragment
# raster des armes de La Chambre par le rendu du SVG et compose la légende canonique
# « Armoiries de <Commune> ». Sinon les armes de La Chambre restent en place et la légende
# conditionnelle n'est pas composée (information `communal_arms_pending`).
#
# État de la recherche du 2026-09-10 : depuis l'environnement de travail, Wikipédia, Wikimedia
# Commons (pages et serveur de fichiers), armorialdefrance.fr, heraldry-wiki, tchinggiz.org et les
# sites des mairies sont bloqués par le proxy de sortie. Les éléments ci-dessous viennent des
# extraits de recherche (titres de fichiers Commons réels ; blasonnements rapportés, NON vérifiés
# sur la page source). Ils sont à confirmer depuis un poste non filtré avant tout usage.
schema_version: 1
status_enum: [VERIFIED, SOURCE_IDENTIFIED_UNVERIFIED, BLAZON_REPORTED_UNVERIFIED, NO_ARMS_FOUND, UNKNOWN]
rights_enum: [CLEARED, PROJECT_INTERNAL, ASSOCIATION_PROVIDED, RESTRICTED, NOT_DOCUMENTED]
verification_procedure:
  - Ouvrir la page Commons du fichier (colonne image_candidates.commons_page) ; relever licence, auteur, date.
  - Télécharger le SVG (image_candidates.download_url, redirection vers upload.wikimedia.org) sous assets/heraldry/communes/<slug>.svg.
  - "Confirmer le blasonnement sur fr.wikipedia.org « Armorial des communes de la Savoie » ou armorialdefrance.fr ; le recopier dans blazon avec blazon_source."
  - "Renseigner svg, sha256 (sha256sum), licence, author, source_url, rights, verified_by, verified_on ; passer status à VERIFIED."
  - "make heraldry-check, puis make layered-compose && make validate && make build-v3."
