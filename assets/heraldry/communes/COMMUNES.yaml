# Registre des armoiries communales des sites de l'exposition (demande du propriétaire, 2026-09-10).
#
# Règle : aucune armoirie n'est composée tant que l'entrée n'est pas VERIFIED — fichier présent,
# SHA-256, licence, auteur, URL source, blasonnement et sa source, vérificateur et date, droits
# acceptés et, pour une licence à attribution (CC BY-SA), ligne de crédit inscrite au canon
# (pages/NN.yaml:canonical_text). Le compositeur (`communal_arms` dans
# prototypes/page-NN/composition.yaml) remplace alors le fragment raster des armes de La Chambre
# par le rendu du SVG et compose la légende canonique « Armoiries de <Commune> ». Sinon les armes
# de La Chambre restent en place et la légende conditionnelle n'est pas composée.
#
# 2026-09-11 : le propriétaire a récupéré les SVG Commons depuis un poste non filtré et documenté
# leur provenance dans assets/svg/blasons/REGISTRY.yaml (PR #22, commit bd5b2b9). Ce registre en
# est la déclinaison technique ; scripts/heraldry_check.py vérifie que chemin et SHA-256 concordent
# entre les deux (clé INSEE). Les trois dessins sont sous CC BY-SA : ils ne peuvent pas être
# reproduits sans crédit ni couverts par la mention « © Tous droits réservés » de la page 15
# (REGISTRY.yaml → droits.tension_a_resoudre). Statut VERIFIED_CREDITS_PENDING tant que la ligne
# de crédit n'est pas inscrite au canon (décision éditoriale du propriétaire) ; ensuite VERIFIED.
schema_version: 2
owner_registry: assets/svg/blasons/REGISTRY.yaml
status_enum: [VERIFIED, VERIFIED_CREDITS_PENDING, SOURCE_IDENTIFIED_UNVERIFIED, BLAZON_REPORTED_UNVERIFIED, NO_ARMS_FOUND, UNKNOWN]
rights_enum: [CLEARED, PROJECT_INTERNAL, ASSOCIATION_PROVIDED, ATTRIBUTION_SHAREALIKE, RESTRICTED, NOT_DOCUMENTED]
credits_rule:
  applies_to_rights: [ATTRIBUTION_SHAREALIKE]
  requirement: >-
    La ligne credit_line doit figurer mot pour mot dans le canonical_text d'une page (mentions
    légales page 15 ou colophon) avant que le dessin soit composé ; la mention globale
    « © Tous droits réservés » doit exclure explicitement ces dessins (partage à l'identique).
  control: scripts/heraldry_check.py (make heraldry-check) et scripts/layered_compose.py (refus de composer)
  proposal: docs/migration-text-layer/COMMUNAL_ARMS.md §5 (texte à arbitrer par le propriétaire, jamais inscrit d'office)
verification_procedure:
  - "Ouvrir la page Commons du fichier ; relever licence, auteur, date ; télécharger le SVG."
  - "Confirmer le blasonnement sur l'Armorial des communes de la Savoie ou armorialdefrance.fr ; le recopier dans blazon avec blazon_source."
  - "Renseigner svg, sha256 (sha256sum), licence, author, source_url, rights, credit_line, verified_by, verified_on."
  - "Licence à attribution : inscrire credit_line au canon (pages/15.yaml) puis passer status à VERIFIED ; sinon VERIFIED_CREDITS_PENDING."
  - "make heraldry-check, puis make layered-compose && make validate && make build-v3."
