droits:
  regime: ATTRIBUTION_SHAREALIKE
  obligations:
    - "Créditer l'auteur, la source Commons et la licence à chaque reproduction (voir credit_ligne)."
    - "Partage à l'identique : toute œuvre dérivée (redessin, recolorisation, recadrage, recomposition) doit être publiée sous la même licence CC BY-SA."
    - "Ne pas ajouter de restriction supplémentaire (DRM, clause « tous droits réservés » couvrant ces images)."
  usage_commercial: "autorisé par CC BY-SA, y compris pour un livret vendu."
  tension_a_resoudre: >-
    La mention « © Tous droits réservés » de la page 15 ne peut pas couvrir ces trois
    images. Prévoir un encart de crédits (page 15 ou colophon) listant les
    credit_ligne, et exclure explicitement les blasons de la mention globale.
  alternative: >-
    Les blasonnements sont libres ; seuls les dessins sont sous licence. Un redessin
    maison lèverait la contrainte, mais le rendu obtenu (notamment le lion de
    Saint-Étienne-de-Cuines) n'a pas été jugé au niveau. Option écartée pour l'instant.

a_faire:
  - "Ajouter l'encart de crédits CC BY-SA au livret et amender la mention page 15."
  - "Obtenir des mairies le statut officiel des blasons (les trois sont « à déterminer »)."
  - "Interroger Sainte-Marie-de-Cuines et Notre-Dame-du-Cruet sur l'existence d'un blason."
  - "Si intégration : déclarer les actifs dans manifest-v3.yaml et lever BLOCKED_PROVENANCE_OR_AMENDMENT sur les zones armoiries de ASSET_SPEC.md."
