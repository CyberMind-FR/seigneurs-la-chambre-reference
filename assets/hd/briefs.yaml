background:
  paper_texture:
    subject: Texture de papier crème très légère, uniforme, sans motif ni tache, tuilable, couleur moyenne #FFFDF7.
    notes: Fond commun du livret ; optionnel (le fond par défaut est une couleur unie). Doit rester quasi uniforme pour ne pas gêner la lisibilité du texte.
