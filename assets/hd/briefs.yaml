# Briefs d'observation pour la régénération HD des croquis (Phase C).
#
# Chaque entrée décrit CE QUI EST VISIBLE dans le fragment canonique (assets/page-NN.jpg,
# bbox de prototypes/page-NN/composition.yaml). Ce sont des descriptions d'observation,
# pas des assertions historiques : elles ne créent aucun contenu éditorial. Les noms de
# sites viennent du canon (pages/NN.yaml). Tout texte, légende, flèche, cartouche, numéro
# ou résidu de titre présent dans le raster est listé dans `remove` : il n'est jamais
# régénéré dans l'image (le texte est une couche indépendante, cf. REGENERATION_RULES.md).
#
# Champs : subject (sujet observé), remove (éléments à ne pas reproduire), notes (contraintes),
#          exclude (motif d'exclusion de la voie « prompt image »).
schema_version: 1
style:
  name: carnet_aquarelle_encre
  fr: >-
    Illustration à l'encre et à l'aquarelle, style carnet de voyage / gravure aquarellée :
    traits d'encre fins brun sépia, lavis d'aquarelle doux et lumineux, palette chaude et
    naturelle (ocre, beige parchemin, gris pierre, vert olive et vert mousse, bleus pâles pour
    les ciels et les sommets enneigés), fond de papier crème uni (#FFFDF7) sans texture marquée,
    lumière diffuse, pas de contours noirs épais, pas de rendu photographique ni 3D.
  negative_fr: >-
    Aucun texte, lettre, chiffre, signature, filigrane, logo, flèche, cartouche, cadre, bordure
    ornementale, bulle ou étiquette. Aucun personnage ou objet moderne (véhicule, câble, panneau)
    sauf indication contraire. Pas de texture de papier vieilli ni de taches. Pas de bordure ni de
    vignettage : le dessin s'estompe naturellement dans le papier crème.
  label_fr: >-
    Vue artistique reconstituée : les proportions, l'échelle et l'état des bâtiments ne sont pas
    nécessairement fidèles (absence d'archive d'époque ; certains sites sont aujourd'hui en ruine).
