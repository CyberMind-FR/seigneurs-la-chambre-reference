captions_inscribed_2026_09_09:
  status: canonical_amendment
  reason: 'Ordre du propriétaire (2026-09-09) : « Go, inscris les 35 légendes au canon ». Les légendes, callouts et cartouches
    raster des 35 illustrations régénérables (rôle *_with_canonical_raster_caption) deviennent des blocs de canonical_text
    composés en couche texte ; le texte raster correspondant est masqué dans les fragments.'
  method: Transcription visuelle à agrandissement ×3 par fragment (jamais OCR comme autorité) ; blocs ajoutés en fin de canonical_text
    (indexation existante inchangée) ; composition avec caption_of + masques déclarés ; à relire par le propriétaire.
  scope: 35 fragments, 68 blocs, 11 pages (01, 02, 03, 05, 06, 07, 08, 09, 10, 11, 12). Les 11 légendes d'armoiries (heraldry_with_canonical_raster_caption)
    et les textes raster hors illustration (bandeaux, pieds de page, cartouche association, logo, encadré chronologie p10)
    ne sont pas concernés.
  transcription_notes:
  - 'Graphies conservées telles que visibles : « coeur » (p02, sans ligature), « Ier » et « XIVe » sans exposant, « Tour &
    Maison de La Tour » (esperluette).'
  - 'p03 nave : deux lignes sans ponctuation dans le raster → deux blocs (« Nef unique de 25 m », « Riche et pauvre, côte
    à côte »).'
  - 'p07 encadré défensif : les flèches typographiques ← et → visibles dans le raster sont conservées dans les blocs « ← Route
    du Mont-Cenis » et « Vallée des Villards → ».'
  - 'p11 encadré vallée : le raster porte deux fois « Le Bugeon » ; les deux occurrences sont inscrites (doublon probable,
    à arbitrer).'
  - 'p12 bandeau réseau : chaque cartouche donne un bloc commune (capitales) et un ou deux blocs de sites, selon les lignes
