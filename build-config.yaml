project: Les Seigneurs de La Chambre
version: 2.2-colorized-final
source:
  page_count: 16
  assets_dir: assets
  pattern: page-{page:02d}.jpg
  qr_registry: qr_registry.yaml
  qr_reference_canvas:
    width: 1920
    height: 2880
  canonical_order:
    1: LES SEIGNEURS DE LA CHAMBRE - couverture
    2: Les Seigneurs de La Chambre
    3: Le Couvent des Cordeliers
    4: La Maison de La Tour
    5: Le Château Joli
    6: La Tour de Burgin
    7: La Tour de Châtel-André
    8: La Maison-Forte du Châtelet
    9: La Maison-Forte de Gruyère
    10: Le Château de Notre-Dame-du-Cruet
    11: La Tour de Notre-Dame-du-Cruet
    12: La Maison Forte de La Landonnière
    13: Un patrimoine à préserver
    14: L'Association
    15: LES SEIGNEURS DE LA CHAMBRE - dos
    16: Remerciements - Amis du Couvent des Cordeliers de La Chambre
render:
  background: '#FFFFFF'
  effective_ppi_min: 300
  preserve_aspect_ratio: true
  crop: false
  qr_overlay: true
  qr_rule: Réinjecter les actifs QR du registre au-dessus du raster final, à leurs coordonnées normalisées.
outputs:
  sequential_16:
    enabled: true
    filename: Seigneurs_La_Chambre_16_pages_100pct_Colorise.pdf
    page_size: A5
    pages: 16
  booklet_a5:
    enabled: false
    filename: Seigneurs_La_Chambre_Livret_A5_16p_100pct_Colorise.pdf
    page_size: A5
    pages: 16
  imposed_a4:
    enabled: true
    filename: Seigneurs_La_Chambre_Livret_A4_Impose_RectoVerso_100pct_Colorise.pdf
    page_size: A4-landscape
    imposition:
    - - 16
      - 1
    - - 2
      - 15
    - - 14
      - 3
    - - 4
      - 13
    - - 12
      - 5
    - - 6
      - 11
    - - 10
      - 7
    - - 8
      - 9
  panels_a2:
    enabled: true
    filename: Seigneurs_La_Chambre_Panneaux_A2_16p_100pct_Colorise.pdf
    page_size: A2
    pages: 16
  panels_a1:
    enabled: true
    filename: Seigneurs_La_Chambre_Panneaux_A1_16p_100pct_Colorise.pdf
    page_size: A1
    pages: 16
release:
  dist_dir: dist
  bundle: Seigneurs_La_Chambre_Print_PDFs.zip
  checksums: SHA256SUMS.txt
  report: build-report.json
  github_artifact_name: seigneurs-la-chambre-print-pdfs
  release_on_tags: v*

# v3 layered build (scripts/build_layered.py): pages with prototypes/page-NN/composition.yaml are
# composed (live text, canonical fragments, deterministic QR SVG); pages without composition
# fall back to the canonical raster + registry QR overlay (v2 method). Page 04 stays a raster
# fallback while PAGE_04_EDITORIAL_ARBITRATION_REQUIRED holds.
v3:
  version: 3.0.0
  fallback_raster_pages_allowed: [4]
  outputs:
    sequential_16: {filename: Seigneurs_La_Chambre_v3_16_pages_A5.pdf, page_size: A5}
    imposed_a4: {filename: Seigneurs_La_Chambre_v3_Livret_A4_Impose_RectoVerso.pdf, page_size: A4-landscape}
    panels_a2: {filename: Seigneurs_La_Chambre_v3_Panneaux_A2_16p.pdf, page_size: A2}
    panels_a1: {filename: Seigneurs_La_Chambre_v3_Panneaux_A1_16p.pdf, page_size: A1}
  release:
    bundle: Seigneurs_La_Chambre_v3_Print_PDFs.zip
    checksums: SHA256SUMS-v3.txt
    report: build-report-v3.json
  pdf_metadata:
    title: Les Seigneurs de La Chambre et leur patrimoine en Maurienne
    author: Amis du Couvent des Cordeliers de La Chambre
    subject: Livret de l'exposition — Notre-Dame-du-Cruet — Décembre 2025
