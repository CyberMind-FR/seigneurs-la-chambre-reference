name: Phase B QR SVG production

on:
  push:
    branches:
      - release/v3.0-phase-b
    paths:
      - .github/workflows/phase-b-qr-svg.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produce-qr-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase B branch
        uses: actions/checkout@v4
        with:
          ref: release/v3.0-phase-b
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install pinned production dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Record tool versions
        run: |
          python - <<'PY'
          import cv2, cairosvg, segno, yaml
          print('Segno', segno.__version__)
          print('CairoSVG', cairosvg.__version__)
          print('OpenCV', cv2.__version__)
          print('PyYAML', yaml.__version__)
          PY

      - name: Generate QR SVG assets from registry
        run: python scripts/generate_qr_svg.py

      - name: Validate QR SVG assets by machine decode
        run: python scripts/validate_qr_svg.py

      - name: Bootstrap incremental manifest v3
        run: python scripts/bootstrap_manifest_v3.py

      - name: Validate canonical reference remains green
        run: make validate

      - name: Assert Phase B invariants
        run: |
          test -f manifest-v3.yaml
          test -f assets/qr-svg/manifest.yaml
          test -f docs/migration-text-layer/PHASE_B_QR_BATCH.md
          test "$(find assets/qr-svg -maxdepth 1 -name '*.svg' | wc -l)" -eq 16
          ! grep -R -Ei '<(text|tspan|foreignObject|script|image)([ >])' assets/qr-svg/*.svg

      - name: Commit produced assets and retire one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/phase-b-qr-svg.yml
          git add assets/qr-svg manifest-v3.yaml docs/migration-text-layer/PHASE_B_QR_BATCH.md .github/workflows/phase-b-qr-svg.yml
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
            exit 0
          fi
          git commit -m 'Phase B: generate and validate deterministic SVG QR batch'
          git push origin HEAD:release/v3.0-phase-b

# retry: validator now uses an external temporary directory so source hygiene remains intact
