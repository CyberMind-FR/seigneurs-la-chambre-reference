name: Build and release print PDFs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optionnel : créer et publier ce tag de release (ex. v2.0.2)'
        required: false
        type: string
  pull_request:
    paths: ['assets/**','pages/**','style.yaml','corrections.yaml','manifest.yaml','qr_registry.yaml','build-config.yaml','requirements-build.txt','scripts/**','.github/workflows/**']
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Validate reference package
        run: make validate
      - name: Build PDFs
        run: make build
      - name: Resolve release mode
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          tag=''
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tag="${GITHUB_REF#refs/tags/}";
          elif [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' && -n "${DISPATCH_TAG:-}" ]]; then tag="${DISPATCH_TAG}"; fi
          if [[ -n "${tag}" && ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then echo "Invalid release tag: ${tag}" >&2; exit 1; fi
          if [[ -n "${tag}" ]]; then echo "publish=true" >> "$GITHUB_OUTPUT"; echo "tag=${tag}" >> "$GITHUB_OUTPUT"; else echo "publish=false" >> "$GITHUB_OUTPUT"; fi
      - name: Create release tag in this workflow
        if: steps.release.outputs.publish == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            existing_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
            [[ "${existing_commit}" == "${GITHUB_SHA}" ]] || { echo "Tag exists on another commit" >&2; exit 1; }
          else
            git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "Release ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
      - name: Upload PDF build artifact
        uses: actions/upload-artifact@v4
        with:
          name: seigneurs-la-chambre-print-pdfs-${{ github.run_number }}
          path: |
            dist/*.pdf
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/build-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          name: Les Seigneurs de La Chambre ${{ steps.release.outputs.tag }}
          files: |
            dist/*.pdf
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/build-report.json
          fail_on_unmatched_files: true
