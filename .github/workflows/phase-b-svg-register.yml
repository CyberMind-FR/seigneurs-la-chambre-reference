name: Phase B register non-QR SVG batch

on:
  push:
    branches:
      - release/v3.0-phase-b
    paths:
      - .github/workflows/phase-b-svg-register.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-svg-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase B branch
        uses: actions/checkout@v4
        with:
          ref: release/v3.0-phase-b
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Register produced SVG assets
        run: python scripts/register_phase_b_svg.py

      - name: Validate produced SVG assets
        run: python scripts/validate_phase_b_svg.py

      - name: Validate canonical package remains green
        run: make validate

      - name: Assert no canonical page was modified by registration
        run: |
          git diff --exit-code HEAD -- assets/page-01.jpg assets/page-02.jpg assets/page-03.jpg assets/page-04.jpg assets/page-05.jpg assets/page-06.jpg assets/page-07.jpg assets/page-08.jpg assets/page-09.jpg assets/page-10.jpg assets/page-11.jpg assets/page-12.jpg assets/page-13.jpg assets/page-14.jpg assets/page-15.jpg assets/page-16.jpg
          git diff --exit-code HEAD -- pages qr_registry.yaml corrections.yaml style.yaml

      - name: Commit registration and retire one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/phase-b-svg-register.yml
          git add assets/ASSET_INDEX_V3.yaml manifest-v3.yaml docs/migration-text-layer/PHASE_B_SVG_BATCH.md .github/workflows/phase-b-svg-register.yml
          if git diff --cached --quiet; then
            echo 'No registration changes to commit'
            exit 0
          fi
          git commit -m 'Phase B: register and validate first non-QR SVG batch'
          git push origin HEAD:release/v3.0-phase-b
