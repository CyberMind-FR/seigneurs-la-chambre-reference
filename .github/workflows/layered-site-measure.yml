name: Layered site-page measurement
on:
  push:
    branches: [release/v3.0-phase-b]
    paths:
      - 'scripts/layered_measure.py'
      - 'pages/05.yaml'
      - 'pages/06.yaml'
      - 'pages/07.yaml'
      - 'pages/08.yaml'
      - 'pages/09.yaml'
      - 'pages/11.yaml'
      - 'pages/12.yaml'
      - 'assets/page-05.jpg'
      - 'assets/page-06.jpg'
      - 'assets/page-07.jpg'
      - 'assets/page-08.jpg'
      - 'assets/page-09.jpg'
      - 'assets/page-11.jpg'
      - 'assets/page-12.jpg'
      - '.github/workflows/layered-site-measure.yml'
  workflow_dispatch:

jobs:
  measure:
    name: page-${{ matrix.page }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        page: ['05', '06', '07', '08', '09', '11', '12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install measurement dependencies
        run: pip install Pillow PyYAML opencv-python-headless
      - name: Measure canonical page
        run: python scripts/layered_measure.py ${{ matrix.page }}
      - name: Show measurement report
        run: cat dist/layered-measure/page-${{ matrix.page }}/measurement.json
      - name: Upload measurement diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: layered-measure-page-${{ matrix.page }}
          path: dist/layered-measure/page-${{ matrix.page }}/
          retention-days: 14
