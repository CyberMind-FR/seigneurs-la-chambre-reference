name: Validate reference package

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml opencv-python-headless

      - name: Validate canonical package
        run: python scripts/validate_reference.py

      - name: Validate every QR from final JPEGs
        run: python scripts/validate_qr.py
