name: Validate reference package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Validate canonical package
        run: python scripts/validate_reference.py

      - name: Validate deterministic QR assets
        run: python scripts/validate_qr.py

      - name: Check PDF builder syntax
        run: python -m py_compile scripts/build_pdfs.py
