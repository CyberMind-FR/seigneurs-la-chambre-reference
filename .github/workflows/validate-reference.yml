name: Validate reference package

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install fonts (Liberation Serif embedded in the v3 PDFs, DejaVu fallback)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Validate canonical package
        run: make validate
