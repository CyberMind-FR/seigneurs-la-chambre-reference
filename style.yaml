project: Les Seigneurs de La Chambre - SpiritualCept Research Notebook
version: 2.0-colorized-exhibition
principle: Séparer strictement contenu, composition, colorisation et actifs fonctionnels.

format_lock:
  page_count: 15
  orientation: portrait
  aspect_ratio: "2:3"
  rule: Conserver les dimensions, proportions, blocs et zones fonctionnelles de la page validée; aucun reflow ou recadrage automatique.

visual_language:
  genre: carnet de recherches historique / affiche patrimoniale documentaire
  era_feel: document d'archives colorisé avec retenue, jamais fantasy ni rendu moderne brillant
  paper: ivoire chaud, patine légère, grain fin et homogène
  ink: brun-noir / sépia profond, plume et traits fins de gravure
  charcoal: fusain discret pour ombres, ruines, volumes et profondeur
  silhouettes: ombre chinoise ponctuelle uniquement lorsqu'elle existe déjà dans la composition validée
  accent: rouge brun pour titres et repères; bleu profond, rouge, or et ivoire pour l'héraldique
  contrast: texte très lisible, noirs propres, demi-teintes conservées, détails nets à l'impression
  illustration: dessin documentaire à la plume et au lavis, aquarelle douce, pastel sec et craie; architecture lisible et non photoréaliste
  ornament: filets fins, fleurons discrets, repères de carnet; jamais décor envahissant

colorization_profile:
  status: locked
  name: SpiritualCept Colorisé
  rule: Coloriser les illustrations sans modifier leur contenu, leur géométrie, leur légende ou leur rôle documentaire.
  palette:
    sky: bleu gris, bleu de Savoie pâle, lavis azur désaturé
    mountains: bleu gris, ardoise, mauve très léger, réserves ivoire pour la neige
    vegetation: vert olive, sauge, mousse, brun vert; saturation modérée
    stone: ocre clair, beige pierre, gris chaud, terre d'ombre
    roofs: ardoise, brun gris, terre cuite seulement si cohérent avec la référence
    watercolor_accents: bleu pâle, vert olive, ocre, terre de Sienne, rouge brun
    heraldry: bleu profond, rouge franc, or chaud; conserver les couleurs héraldiques distinctes
  media_mix:
    - aquarelle transparente pour ciel, relief et paysages
    - pastel et craie pour volumes, végétation et lumières
    - plume sépia/noire pour architecture, plans, cartes et contours
    - fusain léger pour ombres et ruines
  saturation: douce à modérée; jamais de couleurs numériques criardes ou néon
  text_safe_zone: Aucun lavis, texture ou colorisation ne doit réduire le contraste du texte.
  qr_safe_zone: Aucun filtre, colorisation, texture, ombre ou redessin sur les QR.
  no_global_filter: Ne pas appliquer un filtre artistique global qui dégrade texte, cartes, plans ou QR.

layout_rules:
  - Titre principal en tête, large mais sans masquer les illustrations.
  - Sous-titre immédiatement sous le titre.
  - Corps en blocs courts, hiérarchie rouge-brun pour intertitres.
  - Armoiries récurrentes en haut à gauche lorsqu'elles existent dans la page source.
  - Illustration principale dominante, accompagnée de détails secondaires documentaires.
  - Bandeau bas réservé à carte/localisation/QR/encadré pratique selon la page.
  - Aucun élément ne doit être ajouté s'il crée une affirmation historique absente du contenu verrouillé.

content_lock:
  - Ne jamais paraphraser, corriger ou compléter le texte sans validation éditoriale.
  - Ne jamais inventer une date, un nom, une fonction, une catégorie, une légende, un plan, une source, une localisation, un taux ou un prix.
  - Ne jamais créer de personne ou de rôle absent du canonical_text.
  - Les QR codes sont des actifs fonctionnels séparés de l'illustration; ils sont réinjectés après tout traitement graphique.
  - Toute modification éditoriale doit être inscrite dans corrections.yaml.

modification_policy:
  mode: surgical_or_validated_redraw
  base_rule: Une correction ponctuelle se fait chirurgicalement. Une nouvelle colorisation complète n'est admise que sur demande explicite et doit conserver le contenu et la structure.
  deterministic_first: Pour texte, nombre, nom, taux, plan et QR, préférer une retouche déterministe/compositing local à une génération d'image.
  pixel_rule: Pour une correction ponctuelle, préserver tous les pixels hors de la zone explicitement modifiée autant que techniquement possible.
  no_invention: Aucun élément textuel ou graphique absent de la référence validée ne peut être ajouté sans validation.
  source_priority:
    - corrections.yaml
    - pages/NN.yaml canonical_text
    - assets/page-NN.jpg
    - qr_registry.yaml pour les QR
    - assets/reference/* pour les plans et documents réels
    - aucune autre source sans validation explicite

specific_page_rules:
  page_10:
    title: Le Château de Notre-Dame-du-Cruet
    castle_orientation: La vue du château doit conserver l'orientation de la dernière page colorisée validée, inspirée de la vue depuis le Couvent des Cordeliers; ne pas revenir à l'orientation antérieure erronée.
    plan_geometry: Respecter le plan réel fourni, y compris tour de guet, tour-porte, porte d'entrée, tour ronde, tour carrée, basse cour, cour haute, logis, donjon et fossé.
    forbidden_plan_label: "Vous êtes ici"
    visual_style: architecture pierre en plume sépia, aquarelle/pastel doux pour paysage et relief
  page_14:
    title: L'Association
    portrait_rule: Ne pas afficher de photographie ni de portrait de Philippe DEMARIO. Son nom et ses ouvrages restent autorisés dans la bibliographie canonique.

qr_policy:
  registry: qr_registry.yaml
  render: noir pur sur fond blanc ou ivoire très clair, zone de silence intacte
  min_rule: Conserver exactement le payload validé; réinjecter l'actif QR original après tout traitement graphique et lors de la construction des PDF.
  verification: Décoder chaque actif QR et comparer caractère pour caractère au registre avant publication.

print_policy:
  master: PDF HQ produit par scripts/build_pdfs.py
  outputs:
    - séquentiel 15 pages
    - livret A5 16 pages
    - imposition A4 recto-verso
    - panneaux A2
    - panneaux A1
  contrast: micro-contraste renforcé sans écraser les demi-teintes de l'aquarelle et du pastel
  compression: JPEG haute qualité pour les planches; QR réinjectés depuis PNG déterministes
  scaling: ne jamais prétendre créer du détail absent de la source lors d'un agrandissement A2/A1
  preflight: validation du référentiel, des QR, de l'ordre des pages et génération de SHA256SUMS.txt
